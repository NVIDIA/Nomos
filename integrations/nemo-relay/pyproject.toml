[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-relay-nomos"
version = "0.5.0"
description = "Nomos council authorization for NeMo Relay"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "NVIDIA Corporation" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
  "cryptography>=42",
  "jsonschema>=4,<5",
  "nemo-relay-plugin>=0.11.0,<0.12",
]

[project.urls]
Repository = "https://github.com/NVIDIA/Nomos"
Documentation = "https://github.com/NVIDIA/Nomos/tree/main/integrations/nemo-relay/docs/architecture"

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.26",
  "tomli-w>=1",
  # The installed-worker acceptance test drives a real Relay host and CLI.
  "nemo-relay>=0.11.0,<0.12",
  "nemo-relay-cli-bin>=0.11.0,<0.12",
  "uvicorn>=0.30",
  "pytest-cov>=5",
]
lint = [
  "ruff>=0.11",
  "mypy>=1.10",
  "types-jsonschema",
  "codespell>=2.3",
  "pre-commit>=3.7",
]
docs = ["matplotlib>=3.8"]

[tool.uv]
default-groups = ["test", "lint"]
prerelease = "disallow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["installed: opt-in lifecycle-installed worker through the real Relay host"]

[tool.coverage.run]
branch = true
source = ["nemo_relay_nomos"]

[tool.coverage.report]
# The floor `make test` enforces. worker.py runs only inside Relay's worker process, which is not measured.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo_relay_nomos"]

[tool.setuptools.package-data]
nemo_relay_nomos = ["config.schema.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
# docs/architecture quotes the source verbatim (generated by make docs); ruff must not reformat those blocks.
extend-exclude = ["vendor", "docs/architecture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# The formatter owns line length; long user-facing strings are not split mid-sentence.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nemo_relay_nomos"]

[tool.mypy]
python_version = "3.11"
files = ["nemo_relay_nomos"]
# register() sets the store, settings and handlers that every hook then uses; they are Optional until then, and
# re-checking each use would add no safety (an unregistered plugin receives no hooks).
strict_optional = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.codespell]
skip = "./vendor,./.venv,./.cache,./.git,./uv.lock,*.json,*.patch,*.png"
