[project]
name = "nomos-test-destination"
version = "0.1.0"
description = "Local HTTP destination for OpenShell middleware enforcement tests"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
test-destination = "test_destination.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_destination"]

[dependency-groups]
dev = [
 "httpx2>=2,<3",
 "pytest>=8,<10",
 "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
