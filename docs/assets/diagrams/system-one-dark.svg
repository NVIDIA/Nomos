<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 610' width='1040' height='610' role='img'><title>System one and the council</title><defs><marker id='arrow-edge' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#656c76'/></marker><marker id='arrow-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4493f8'/></marker><marker id='arrow-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f85149'/></marker><marker id='arrow-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#3fb950'/></marker><marker id='arrow-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ab7df8'/></marker></defs><rect width='1040' height='610' fill='#0d1117'/><text x='16' y='26' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='17' font-weight='700' fill='#e6edf3' text-anchor='start'>System one: one classifier call before the council</text><text x='16' y='46' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12' font-weight='400' fill='#9198a1' text-anchor='start'>Off by default. Each level is its own setting. An enabled fast path signs a Writ that no council member has read.</text><rect x='16' y='150' width='150' height='74' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><text x='28' y='170' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Policy (OPA)</text><text x='28' y='188' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>ran and allowed</text><text x='28' y='203' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>the request</text><rect x='210' y='126' width='236' height='122' rx='6' fill='#2a1f45' stroke='#ab7df8' stroke-width='1.0'/><text x='222' y='146' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>System one (member zero)</text><text x='222' y='164' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#4493f8' text-anchor='start'>system_one.enabled</text><text x='222' y='181' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>One call. Answers a versioned</text><text x='222' y='196' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>question catalog about the request.</text><text x='222' y='211' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>It never votes.</text><path d='M166 187H208' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><rect x='500' y='76' width='262' height='112' rx='6' fill='#0d2847' stroke='#4493f8' stroke-width='1.0'/><text x='512' y='96' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Fast path (opt-in)</text><text x='512' y='114' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#4493f8' text-anchor='start'>system_one.fast_path.enabled</text><text x='512' y='131' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>Level 2: a read that passes the</text><text x='512' y='146' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>read-only gate and every limit.</text><text x='512' y='161' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>Level 3: a low-risk change.</text><rect x='816' y='96' width='208' height='72' rx='6' fill='#0d1117' stroke='#4493f8' stroke-width='1.0'/><text x='828' y='116' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Writ, no council</text><text x='828' y='134' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>threshold_used: fast_path</text><text x='828' y='149' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>or fast_path_mutation</text><path d='M446 160H472V132H498' fill='none' stroke='#4493f8' stroke-width='2' stroke-linejoin='round' marker-end='url(#arrow-blue)'/><path d='M762 132H814' fill='none' stroke='#4493f8' stroke-width='2' stroke-linejoin='round' marker-end='url(#arrow-blue)'/><rect x='500' y='212' width='524' height='232' rx='10' fill='#151b23' stroke='#3d444d' stroke-width='1.0' stroke-dasharray='5 4'/><text x='514' y='234' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12' font-weight='700' fill='#e6edf3' text-anchor='start'>COUNCIL</text><text x='514' y='250' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='400' fill='#9198a1' text-anchor='start'>every other request, and every request at level 1</text><rect x='514' y='262' width='244' height='168' rx='6' fill='#3b2210' stroke='#f0883e' stroke-width='1.0'/><text x='526' y='282' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Chairman</text><text x='526' y='300' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#4493f8' text-anchor='start'>chairman.provider: llm | system_one</text><text x='526' y='317' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>llm: a model call sets the risk</text><text x='526' y='332' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>level and the threshold.</text><text x='526' y='347' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>system_one: no call. Both come</text><text x='526' y='362' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>from the answers above; quorum</text><text x='526' y='377' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>only for a confident, read-only,</text><text x='526' y='392' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>low-risk request.</text><rect x='780' y='262' width='230' height='98' rx='6' fill='#3b2210' stroke='#f0883e' stroke-width='1.0'/><text x='792' y='282' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Voting members</text><text x='792' y='300' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>See every system one answer</text><text x='792' y='315' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>beside the request, then vote.</text><rect x='780' y='374' width='230' height='56' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><text x='792' y='394' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Writ or denial</text><text x='792' y='412' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>unanimous unless quorum is allowed</text><path d='M446 200H472V300H512' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><path d='M758 310H778' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><path d='M895 360V372' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><rect x='210' y='290' width='236' height='106' rx='6' fill='#3c1618' stroke='#f85149' stroke-width='1.0'/><text x='222' y='310' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>No answer</text><text x='222' y='328' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>Error, timeout, or a request that</text><text x='222' y='343' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>masking would alter. The council</text><text x='222' y='358' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>decides; a system one chairman</text><text x='222' y='373' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>falls back to unanimous / high.</text><path d='M328 248V288' fill='none' stroke='#f85149' stroke-width='1.5' stroke-linejoin='round' stroke-dasharray='5 4' marker-end='url(#arrow-red)'/><path d='M446 336H512' fill='none' stroke='#f85149' stroke-width='1.5' stroke-linejoin='round' stroke-dasharray='5 4' marker-end='url(#arrow-red)'/><rect x='16' y='290' width='170' height='92' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><text x='28' y='310' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Ledger record</text><text x='28' y='328' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>Every answer, and what</text><text x='28' y='343' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>each fast path would have</text><text x='28' y='358' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>decided, enabled or not.</text><path d='M210 220H186V288' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' stroke-dasharray='5 4' marker-end='url(#arrow-edge)'/><rect x='16' y='462' width='1008' height='132' rx='10' fill='#151b23' stroke='#3d444d' stroke-width='1.0' stroke-dasharray='5 4'/><text x='30' y='484' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12' font-weight='700' fill='#e6edf3' text-anchor='start'>WHICH SYSTEM ONE</text><text x='30' y='500' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='400' fill='#9198a1' text-anchor='start'>system_one.provider selects the backend and the key it uses</text><rect x='30' y='510' width='486' height='72' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><text x='42' y='530' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>nemotron (default)</text><text x='42' y='548' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#4493f8' text-anchor='start'>provider: nemotron</text><text x='42' y='565' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>NVIDIA-hosted Nemotron System 1. Endpoint and model are built in; key NVIDIA_API_KEY.</text><rect x='528' y='510' width='482' height='72' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><text x='540' y='530' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>external</text><text x='540' y='548' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#4493f8' text-anchor='start'>provider: external</text><text x='540' y='565' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>Your own endpoint. Set base_url and model_version; key SYSTEM_ONE_API_KEY.</text></svg>
