<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 400' width='1040' height='400' role='img'><title>Adapting an agent to Nomos</title><defs><marker id='arrow-edge' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#656c76'/></marker><marker id='arrow-blue' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4493f8'/></marker><marker id='arrow-red' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f85149'/></marker><marker id='arrow-green' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#3fb950'/></marker><marker id='arrow-purple' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#ab7df8'/></marker></defs><rect width='1040' height='400' fill='#0d1117'/><text x='16' y='26' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='17' font-weight='700' fill='#e6edf3' text-anchor='start'>Adapt your agent: one wrapper around its tool calls</text><text x='16' y='46' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12' font-weight='400' fill='#9198a1' text-anchor='start'>Your code, roughly 40 lines. Nomos and the executor are services it calls; neither calls into your agent.</text><rect x='352' y='66' width='200' height='62' rx='10' fill='#151b23' stroke='#3d444d' stroke-width='1.0' stroke-dasharray='5 4'/><text x='452' y='90' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='700' fill='#e6edf3' text-anchor='middle'>Nomos council</text><text x='452' y='108' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='middle'>MCP: /mcp (Bearer proxy token)</text><rect x='686' y='66' width='200' height='62' rx='10' fill='#151b23' stroke='#3d444d' stroke-width='1.0' stroke-dasharray='5 4'/><text x='786' y='90' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='700' fill='#e6edf3' text-anchor='middle'>Executor</text><text x='786' y='108' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='middle'>HTTP: /v1/writs/execute</text><rect x='16' y='176' width='130' height='92' rx='6' fill='#0d1117' stroke='#e6edf3' stroke-width='1.25'/><text x='81' y='204' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='13' font-weight='700' fill='#e6edf3' text-anchor='middle'>Your agent</text><text x='81' y='222' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='400' fill='#9198a1' text-anchor='middle'>any framework,</text><text x='81' y='238' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='400' fill='#9198a1' text-anchor='middle'>any model</text><text x='81' y='256' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='middle'>wants to run</text><rect x='166' y='150' width='862' height='144' rx='10' fill='#151b23' stroke='#4493f8' stroke-width='1.0' stroke-dasharray='5 4'/><text x='180' y='170' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12' font-weight='700' fill='#4493f8' text-anchor='start'>NOMOS ADAPTER (your code)</text><rect x='180' y='184' width='160' height='96' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><circle cx='198' cy='202' r='10' fill='#9198a1'/><text x='198' y='206' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='700' fill='#0d1117' text-anchor='middle'>1</text><text x='214' y='207' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Intercept</text><text x='190' y='230' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>map the call and its task:</text><text x='190' y='246' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>command, context,</text><text x='190' y='262' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>justification, blast_radius</text><rect x='350' y='184' width='160' height='96' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><circle cx='368' cy='202' r='10' fill='#9198a1'/><text x='368' y='206' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='700' fill='#0d1117' text-anchor='middle'>2</text><text x='384' y='207' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Authorize</text><text x='360' y='230' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>council_authorize(...)</text><text x='360' y='246' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>agent_id, auth_token,</text><text x='360' y='262' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>council_id, evidence</text><path d='M340 232H348' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><rect x='520' y='184' width='160' height='96' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><circle cx='538' cy='202' r='10' fill='#f0883e'/><text x='538' y='206' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='700' fill='#0d1117' text-anchor='middle'>3</text><text x='554' y='207' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Decide</text><text x='530' y='230' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>status == &quot;approved&quot;?</text><text x='530' y='246' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>no: return guidance</text><text x='530' y='262' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>yes: take the writ</text><path d='M510 232H518' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><rect x='690' y='184' width='160' height='96' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><circle cx='708' cy='202' r='10' fill='#4493f8'/><text x='708' y='206' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='700' fill='#0d1117' text-anchor='middle'>4</text><text x='724' y='207' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Execute</text><text x='700' y='230' font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>POST {&quot;writ&quot;: ...}</text><text x='700' y='246' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>header X-Agent-ID</text><text x='700' y='262' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>check success, stage</text><path d='M680 232H688' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><rect x='860' y='184' width='160' height='96' rx='6' fill='#0d1117' stroke='#3d444d' stroke-width='1.0'/><circle cx='878' cy='202' r='10' fill='#3fb950'/><text x='878' y='206' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='11' font-weight='700' fill='#0d1117' text-anchor='middle'>5</text><text x='894' y='207' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='12.5' font-weight='600' fill='#e6edf3' text-anchor='start'>Keep receipt</text><text x='870' y='230' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>full ExecutionResult,</text><text x='870' y='246' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>signed by the executor;</text><text x='870' y='262' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#9198a1' text-anchor='start'>never edit its output</text><path d='M850 232H858' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><path d='M146 232H178' fill='none' stroke='#e6edf3' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><path d='M406.0 184V130' fill='none' stroke='#656c76' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-edge)'/><text x='400.0' y='146' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10' font-weight='400' fill='#9198a1' text-anchor='end'>action + task context</text><path d='M454.0 130V182' fill='none' stroke='#4493f8' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-blue)'/><text x='460.0' y='146' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10' font-weight='400' fill='#4493f8' text-anchor='start'>decision + writ</text><path d='M746.0 184V130' fill='none' stroke='#4493f8' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-blue)'/><text x='740.0' y='146' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10' font-weight='400' fill='#4493f8' text-anchor='end'>writ</text><path d='M794.0 130V182' fill='none' stroke='#3fb950' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-green)'/><text x='800.0' y='146' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10' font-weight='400' fill='#3fb950' text-anchor='start'>signed result</text><path d='M600.0 280V318H104V270' fill='none' stroke='#f85149' stroke-width='1.5' stroke-linejoin='round' marker-end='url(#arrow-red)'/><text x='592.0' y='334' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#f85149' text-anchor='end'>denied: guidance goes back; the agent revises and asks again</text><path d='M940.0 280V356H52V270' fill='none' stroke='#ab7df8' stroke-width='1.5' stroke-linejoin='round' stroke-dasharray='5 4' marker-end='url(#arrow-purple)'/><text x='932.0' y='372' font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size='10.5' font-weight='400' fill='#ab7df8' text-anchor='end'>the receipt rides in certified_evidence on the next request</text></svg>
