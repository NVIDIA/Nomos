name: CI

on:
  pull_request:
  # Branch pushes are already covered by the pull_request event. Keeping "**"
  # here ran the whole matrix twice for every push to a branch with an open PR:
  # the concurrency group keys on github.ref, which differs between push and
  # pull_request events, so the two runs never cancelled each other.
  push:
    branches:
      - main
      - develop
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_LINK_MODE: copy

jobs:
  validate_config:
    name: Validate config
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Validate configuration
        env:
          NVIDIA_API_KEY: dummy # pragma: allowlist secret
          COUNCIL_REDIS_HOST: redis
          COUNCIL_REDIS_PASSWORD: dummy # pragma: allowlist secret
        run: |
          uv lock --check
          uv run python -m compileall -q nomos executors trusted_executor_contract monitor demo scripts
          uv run python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"
          uv run python -c "from nomos.config.settings import load_config; load_config('configs/council.yaml')"
          uv run python scripts/validate_council_routing.py --mode public

      - name: Validate published NAT extra
        run: |
          python -m venv /tmp/nomos-nat-install
          /tmp/nomos-nat-install/bin/python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          /tmp/nomos-nat-install/bin/python -m pip install ".[nat]"
          /tmp/nomos-nat-install/bin/python -m pip check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  type_check:
    name: Type check
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Run MyPy
        run: uv run mypy nomos

  unit_tests:
    name: Unit tests
    needs:
      - validate_config
      - lint
      - type_check
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git nodejs
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Run local tests with coverage
        run: |
          mkdir -p reports/junit
          uv run pytest tests/ \
            --ignore=tests/assurance \
            --ignore=tests/test_grpc_live_smoke.py \
            --ignore=tests/test_mcp_live_integration.py \
            --ignore=tests/test_multi_council_mcp_live.py \
            --cov \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit/all.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-test-reports
          path: |
            reports/junit/all.xml
            coverage.xml
          retention-days: 14

  assurance:
    name: Assurance integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install pinned Compass and assurance dependencies
        run: uv sync --python 3.13 --frozen --extra all --extra assurance-compass

      - name: Assurance tests and deterministic labeled evaluation
        run: |
          mkdir -p reports/assurance
          uv run pytest tests/assurance --cov=assurance --cov-fail-under=79 --cov-report=xml:reports/assurance/coverage.xml --junitxml=reports/assurance/tests.xml
          node --test tests/assurance/dashboard_model.test.mjs
          uv run python scripts/assurance_evaluate.py > reports/assurance/evaluation.json

      - name: Validate assurance Helm configurations
        run: |
          run_helm() {
            docker run --rm \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
              "$@"
          }
          run_helm lint deploy/kubernetes/nomos
          run_helm template nomos deploy/kubernetes/nomos > /dev/null
          run_helm lint deploy/kubernetes/nomos -f deploy/assurance/helm-values.yaml
          run_helm template nomos deploy/kubernetes/nomos -f deploy/assurance/helm-values.yaml > /dev/null
          run_helm lint deploy/kubernetes/nomos -f deploy/assurance/helm-values.yaml -f deploy/assurance/helm-ethos-values.yaml
          run_helm template nomos deploy/kubernetes/nomos -f deploy/assurance/helm-values.yaml -f deploy/assurance/helm-ethos-values.yaml > /dev/null

      - name: Upload assurance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assurance-results
          path: reports/assurance
          retention-days: 14

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Scan tracked files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline --exclude-files 'deploy/\.env\.example$' --

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r nomos executors trusted_executor_contract monitor demo assurance

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run Hadolint
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --entrypoint "" \
            hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c \
            hadolint --ignore DL3008 --ignore DL3013 deploy/Dockerfile deploy/Dockerfile.agent-signup deploy/Dockerfile.demo deploy/Dockerfile.executor deploy/Dockerfile.monitor deploy/Dockerfile.openshell deploy/assurance/Dockerfile

  opa_policy_tests:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Run OPA policy tests
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            openpolicyagent/opa:1.17.0-static@sha256:94830e998dd9df8e49a61826f1ad03d8a68d3ecd52f105e06a2adb93b459ad46 \
            test policies

  helm_render:
    name: Helm render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Lint and render chart
        run: |
          run_helm() {
            docker run --rm \
              --volume "$PWD:/workspace" \
              --workdir /workspace \
              alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
              "$@"
          }
          run_helm lint deploy/kubernetes/nomos
          run_helm lint deploy/kubernetes/nomos --values deploy/kubernetes/kind-values.yaml
          run_helm template nomos deploy/kubernetes/nomos > /dev/null
          run_helm template nomos deploy/kubernetes/nomos --values deploy/kubernetes/kind-values.yaml > /dev/null

  compose_config:
    name: Compose config
    needs:
      - secret_scan
      - bandit
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Render Compose configuration
        run: docker compose -f deploy/docker-compose.yml config > compose.rendered.yml

      - name: Upload rendered Compose configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compose-rendered
          path: compose.rendered.yml
          retention-days: 14

  package:
    name: Package
    # Disabled: Nomos does not publish a wheel yet, so nothing consumes this
    # artifact. Re-enable when a release/publish flow exists.
    if: ${{ false }}
    needs:
      - secret_scan
      - bandit
      - hadolint
    runs-on: ubuntu-latest
    container: python:3.13-slim@sha256:6771159cd4fa5d9bba1258caf0b82e6b73458c694d178ad97c5e925c2d0e1a91
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Restore Python cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/uv
            .venv
          key: python-3.13-uv-${{ hashFiles('uv.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/62/36/a3aed958d60531cb442b7ab4596cda7b3621cfb916f8ae1d6769795c7dc1/pip-26.2-py3-none-any.whl#sha256=931c303696af6fa3417112103b1cad26890e5a07eccb5b99783700e33f2b8aad"
          uv sync --frozen --extra all

      - name: Build package
        run: uv build

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package
          path: dist/
          retention-days: 14

  docker_build_images:
    name: Docker build images
    # Disabled: images are built at deploy time (docker-compose / kind-up.sh)
    # and CI has no registry to push to. Re-enable alongside a publish target.
    if: ${{ false }}
    needs:
      - secret_scan
      - bandit
      - hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build images
        run: |
          docker build -f deploy/Dockerfile -t nomos-council:ci .
          docker build -f deploy/Dockerfile.monitor -t nomos-monitor:ci .
          docker build -f deploy/Dockerfile.demo -t nomos-demo:ci .
          docker build -f deploy/Dockerfile.executor -t nomos-executor:ci .
          docker build -f deploy/Dockerfile.openshell -t nomos-openshell:ci .
