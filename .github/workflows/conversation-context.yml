name: Conversation context service

"on":
  pull_request:
    paths:
      - integrations/conversation-context/**
      - .github/workflows/conversation-context.yml
  push:
    branches: [main, develop]
    paths:
      - integrations/conversation-context/**
      - .github/workflows/conversation-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-service:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: integrations/conversation-context
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Install Python
        run: uv python install '${{ matrix.python }}'
      - name: Install locked dependencies
        run: uv sync --locked --python '${{ matrix.python }}'
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test isolation, auth and retention
        run: uv run --locked pytest --cov=nomos_context_service --cov-report=term-missing --cov-fail-under=90
