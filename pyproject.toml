[project]
name = "nomos"
version = "0.1.0"
description = "Security Council + Permissioned Action Ledger: Nomos authorization for privileged operations with cryptographic accountability"
license = { text = "LicenseRef-NvidiaProprietary" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=48.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
nat = [
    "nvidia-nat[mcp]>=1.8.0,<2.0.0",
    # Security floors for transitive deps introduced by the nvidia-nat stack.
    # Not imported directly by nomos; pinned at advisory fixed versions so the
    # manifest-based scanner and image builds never select a vulnerable range.
    "authlib>=1.6.11",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.27",
    "mcp>=1.28.1",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
grpc = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "mcp>=1.28.1",
    "starlette>=1.3.1",
    "protobuf>=4.25.0",
]
postgres = [
    "psycopg[binary,pool]>=3.2",
]
all-backends = [
    "nomos[nat,openai,anthropic]",
]
dev = [
    "nomos[grpc,postgres]",
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=1.28.1",
    "starlette>=1.3.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "uvicorn[standard]>=0.27",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.8.0",
    "detect-secrets>=1.5.0",
]
all = [
    "nomos[all-backends,dev,grpc]",
]

[project.entry-points.'nat.plugins']
nomos = "nomos.nat.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
override-dependencies = [
    # nvidia-nat currently caps cryptography below 47, but the fixed release for
    # GHSA-537c-gmf6-5ccf is 48.0.1. Keep the security floor authoritative until
    # the upstream constraint catches up.
    "cryptography>=48.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["nomos", "trusted_executor_contract", "nomos_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "live_mcp: opt-in tests that exercise a deployed MCP council",
    "kind_e2e: opt-in tests that exercise a deployed Kind council and executor",
]

[tool.coverage.run]
source = ["nomos", "executors", "trusted_executor_contract", "nomos_runtime"]
omit = [
    "nomos/grpc/v1/*_pb2*.py",
    # Integration-tested against a real PostgreSQL (NOMOS_TEST_DATABASE_URL);
    # their suites skip when no server is reachable, so they are excluded from
    # the unit-coverage floor rather than dragging it on machines without PG.
    "nomos/store/postgres_store.py",
    "nomos/store/migrate.py",
    "nomos/level_1/ledger/postgres_storage.py",
]

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S", "B", "UP", "RUF"]
# S = flake8-bandit rules, B = flake8-bugbear, UP = pyupgrade, RUF = ruff-specific
ignore = [
    "S101",   # assert used (fine in tests)
    "S603",   # subprocess call — checked by design in executor
    "S607",   # partial executable path — intentional in permission categorizer
    "S108",   # hardcoded temp directory — used in tests
    "B008",   # function call in default arg — used by pydantic Field()
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts, hardcoded passwords in test fixtures
"scripts/**" = ["S101", "S105", "E501"]
"nomos/grpc/v1/*_pb2*.py" = ["ALL"]
"nomos/grpc/server.py" = ["N802"]
"tests/test_opa_client.py" = ["N802"]
"executors/docker/api.py" = ["N802"]
"executors/openshell/runtime.py" = ["N802"]
"tests/test_openshell_executor.py" = ["N802"]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B105", "B107", "B110", "B104", "B310", "B404", "B602", "B603", "B607"]
