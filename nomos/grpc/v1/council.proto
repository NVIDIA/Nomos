syntax = "proto3";

package nomos.council.v1;

import "google/protobuf/struct.proto";

service CouncilProxy {
  rpc Authorize(CouncilToolRequest) returns (CouncilToolResponse);
  rpc ProposeIntent(CouncilToolRequest) returns (CouncilToolResponse);
  rpc CheckStatus(CouncilToolRequest) returns (CouncilToolResponse);
  rpc PendingApprovals(CouncilToolRequest) returns (CouncilToolResponse);
  rpc GetPublicKey(CouncilToolRequest) returns (CouncilToolResponse);
  rpc CheckWritStatus(CouncilToolRequest) returns (CouncilToolResponse);
  rpc CallTool(CallToolRequest) returns (CouncilToolResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message CouncilToolRequest {
  google.protobuf.Struct arguments = 1;
  string raw_json = 2;
}

message CallToolRequest {
  string tool_name = 1;
  google.protobuf.Struct arguments = 2;
  string raw_json = 3;
}

message CouncilToolResponse {
  string tool_name = 1;
  google.protobuf.Struct result = 2;
  string raw_json = 3;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string mcp_url = 2;
  string error = 3;
}
