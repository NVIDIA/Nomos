# SPDX-License-Identifier: Apache-2.0
# Companion services for an existing council; no database ports are published.
name: nomos-assurance-live
services:
  assurance-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomos
      POSTGRES_USER: nomos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=5, -c, max_replication_slots=5, -c, max_slot_wal_keep_size=1GB, -c, hba_file=/etc/assurance-pg_hba.conf]
    volumes:
      - postgres-primary:/var/lib/postgresql/data
      - ./postgres-primary-init.sql:/docker-entrypoint-initdb.d/10-replication.sql:ro
      - ./pg_hba.conf:/etc/assurance-pg_hba.conf:ro
    networks: [council]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nomos -d nomos"]
      interval: 2s
      timeout: 2s
      retries: 30
  assurance-postgres-standby:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      assurance-postgres:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      PGPASSWORD: ${REPLICATION_PASSWORD:?required}
    entrypoint: [sh, /bootstrap/standby.sh]
    volumes:
      - postgres-standby:/var/lib/postgresql/data
      - ./postgres-standby.sh:/bootstrap/standby.sh:ro
    networks: [council]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nomos -d nomos"]
      interval: 2s
      timeout: 2s
      retries: 30
  ledger-reader:
    image: ${ASSURANCE_IMAGE:-nomos-assurance:live}
    restart: unless-stopped
    command: [uvicorn, assurance.council_source:create_app, --factory, --host, 0.0.0.0, --port, '8080', --no-access-log]
    environment:
      COUNCIL_SOURCE_URL: http://council:9901
      COUNCIL_ID: ${COUNCIL_ID:?required}
      SOURCE_TOKEN: ${SOURCE_TOKEN:?required}
    networks: [council]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
  observer:
    image: ${ASSURANCE_IMAGE:-nomos-assurance:live}
    restart: unless-stopped
    depends_on: [ledger-reader]
    environment:
      SOURCE_URL: http://ledger-reader:8080
      COUNCIL_ID: ${COUNCIL_ID:?required}
      CHAIN_ID: ${CHAIN_ID:?required}
      SOURCE_TOKEN: ${SOURCE_TOKEN:?required}
      DASHBOARD_USER: ${DASHBOARD_USER:?required}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?required}
      TRUSTED_KEYS_FILE: /trust/keys.json
      STATE_PATH: /state/live.db
      POLL_SECONDS: '3'
    ports: ['127.0.0.1:9911:8080']
    volumes:
      - observer-state:/state
      - ${TRUSTED_KEYS_FILE:?required}:/trust/keys.json:ro
    networks: [council]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
networks:
  council:
    external: true
    name: ${COUNCIL_NETWORK:?required}
volumes:
  postgres-primary:
  postgres-standby:
  observer-state:
