# Redis Sentinel topology for the Docker Compose stack.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.redis-sentinel.yml \
#     --profile executor-openshell up -d
#
# Or through scripts/deploy_stack.sh, where Sentinel is the default Compose topology:
#   DEPLOY_TARGET=compose ./scripts/deploy_stack.sh

x-redis-node-command: &redis-node-command
  - sh
  - -c
  - |
    set -eu
    cat > /tmp/redis.conf <<EOF
    dir /data
    appendonly yes
    appendfsync everysec
    protected-mode yes
    requirepass $$REDIS_PASSWORD
    masterauth $$REDIS_PASSWORD
    replica-announce-ip $$REDIS_ANNOUNCE_HOST
    replica-announce-port 6379
    EOF
    redis_port=6379
    self_host="$$REDIS_ANNOUNCE_HOST"
    master_host=""
    master_port=""
    for sentinel_host in redis-sentinel-1 redis-sentinel-2 redis-sentinel-3; do
      # Bound each probe. On a cold start the sentinels cannot be up yet -- they
      # wait for these nodes to report healthy -- so every name fails to resolve,
      # and an unbounded lookup costs ~20s each (60s total). That exceeds the
      # healthcheck budget below (start_period + retries * interval), so compose
      # marks the nodes unhealthy and aborts the deploy before redis-server ever
      # starts. When a sentinel is actually reachable it answers in milliseconds,
      # so this timeout only ever truncates the cold-start case.
      if timeout 5 redis-cli -h "$$sentinel_host" -p 26379 -a "$$REDIS_PASSWORD" --no-auth-warning SENTINEL get-master-addr-by-name "$$REDIS_SENTINEL_SERVICE_NAME" > /tmp/current-master 2>/dev/null; then
        master_host="$$(sed -n '1p' /tmp/current-master)"
        master_port="$$(sed -n '2p' /tmp/current-master)"
        break
      fi
    done
    if [ -n "$$master_host" ] && [ "$$master_host" != "$$self_host" ]; then
      printf 'replicaof %s %s\n' "$$master_host" "$${master_port:-$$redis_port}" >> /tmp/redis.conf
    elif [ -z "$$master_host" ] && [ "$$self_host" != "$$REDIS_INITIAL_MASTER" ]; then
      printf 'replicaof %s %s\n' "$$REDIS_INITIAL_MASTER" "$$redis_port" >> /tmp/redis.conf
    fi
    exec redis-server /tmp/redis.conf

x-redis-node-env: &redis-node-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-nomos-dev}
  REDIS_SENTINEL_SERVICE_NAME: ${REDIS_SENTINEL_SERVICE_NAME:-nomos-master}
  REDIS_INITIAL_MASTER: redis

x-redis-node-healthcheck: &redis-node-healthcheck
  test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

x-redis-sentinel-command: &redis-sentinel-command
  - sh
  - -c
  - |
    set -eu
    mkdir -p /data/sentinel
    if [ ! -s /data/sentinel/sentinel.conf ]; then
    cat > /data/sentinel/sentinel.conf <<EOF
    port 26379
    dir /data/sentinel
    protected-mode yes
    requirepass $$REDIS_PASSWORD
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor $$REDIS_SENTINEL_SERVICE_NAME redis 6379 2
    sentinel auth-pass $$REDIS_SENTINEL_SERVICE_NAME $$REDIS_PASSWORD
    sentinel down-after-milliseconds $$REDIS_SENTINEL_SERVICE_NAME $${REDIS_SENTINEL_DOWN_AFTER_MS:-5000}
    sentinel failover-timeout $$REDIS_SENTINEL_SERVICE_NAME $${REDIS_SENTINEL_FAILOVER_TIMEOUT_MS:-30000}
    sentinel parallel-syncs $$REDIS_SENTINEL_SERVICE_NAME 1
    EOF
    fi
    exec redis-sentinel /data/sentinel/sentinel.conf

x-redis-sentinel-healthcheck: &redis-sentinel-healthcheck
  test: ["CMD-SHELL", "redis-cli -p 26379 --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

x-redis-sentinel-env: &redis-sentinel-env
  REDIS_PASSWORD: ${REDIS_PASSWORD:-nomos-dev}
  REDIS_SENTINEL_SERVICE_NAME: ${REDIS_SENTINEL_SERVICE_NAME:-nomos-master}
  REDIS_SENTINEL_DOWN_AFTER_MS: ${REDIS_SENTINEL_DOWN_AFTER_MS:-5000}
  REDIS_SENTINEL_FAILOVER_TIMEOUT_MS: ${REDIS_SENTINEL_FAILOVER_TIMEOUT_MS:-30000}

x-redis-client-env: &redis-client-env
  COUNCIL_REDIS_MODE: sentinel
  COUNCIL_REDIS_SENTINEL_SERVICE_NAME: ${REDIS_SENTINEL_SERVICE_NAME:-nomos-master}
  COUNCIL_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  COUNCIL_REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
  COUNCIL_REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}

x-executor-redis-client-env: &executor-redis-client-env
  EXECUTOR_REDIS_MODE: sentinel
  EXECUTOR_REDIS_SENTINEL_SERVICE_NAME: ${REDIS_SENTINEL_SERVICE_NAME:-nomos-master}
  EXECUTOR_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  EXECUTOR_REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
  EXECUTOR_REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}

x-signup-redis-client-env: &signup-redis-client-env
  NOMOS_SIGNUP_REDIS_MODE: sentinel
  NOMOS_SIGNUP_REDIS_SENTINEL_SERVICE_NAME: ${REDIS_SENTINEL_SERVICE_NAME:-nomos-master}
  NOMOS_SIGNUP_REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  NOMOS_SIGNUP_REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
  NOMOS_SIGNUP_REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}

x-redis-sentinel-depends: &redis-sentinel-depends
  redis:
    condition: service_healthy
  redis-1:
    condition: service_healthy
  redis-2:
    condition: service_healthy
  redis-sentinel-1:
    condition: service_healthy
  redis-sentinel-2:
    condition: service_healthy
  redis-sentinel-3:
    condition: service_healthy

services:
  redis:
    hostname: redis
    command: *redis-node-command
    environment:
      <<: *redis-node-env
      REDIS_ANNOUNCE_HOST: redis
    healthcheck: *redis-node-healthcheck

  redis-1:
    image: redis:7-alpine
    hostname: redis-1
    restart: unless-stopped
    command: *redis-node-command
    environment:
      <<: *redis-node-env
      REDIS_ANNOUNCE_HOST: redis-1
    volumes:
      - redis-data-1:/data
    networks:
      - nomos-net
    healthcheck: *redis-node-healthcheck

  redis-2:
    image: redis:7-alpine
    hostname: redis-2
    restart: unless-stopped
    command: *redis-node-command
    environment:
      <<: *redis-node-env
      REDIS_ANNOUNCE_HOST: redis-2
    volumes:
      - redis-data-2:/data
    networks:
      - nomos-net
    healthcheck: *redis-node-healthcheck

  redis-sentinel-1:
    image: redis:7-alpine
    hostname: redis-sentinel-1
    restart: unless-stopped
    command: *redis-sentinel-command
    environment: *redis-sentinel-env
    depends_on:
      redis:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
    networks:
      - nomos-net
    volumes:
      - redis-sentinel-1-data:/data/sentinel
    healthcheck: *redis-sentinel-healthcheck

  redis-sentinel-2:
    image: redis:7-alpine
    hostname: redis-sentinel-2
    restart: unless-stopped
    command: *redis-sentinel-command
    environment: *redis-sentinel-env
    depends_on:
      redis:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
    networks:
      - nomos-net
    volumes:
      - redis-sentinel-2-data:/data/sentinel
    healthcheck: *redis-sentinel-healthcheck

  redis-sentinel-3:
    image: redis:7-alpine
    hostname: redis-sentinel-3
    restart: unless-stopped
    command: *redis-sentinel-command
    environment: *redis-sentinel-env
    depends_on:
      redis:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
    networks:
      - nomos-net
    volumes:
      - redis-sentinel-3-data:/data/sentinel
    healthcheck: *redis-sentinel-healthcheck

  council:
    depends_on:
      <<: *redis-sentinel-depends
    environment:
      <<: *redis-client-env

  agent-signup:
    depends_on:
      <<: *redis-sentinel-depends
      monitor:
        condition: service_healthy
    environment:
      <<: *signup-redis-client-env

  executor-default:
    depends_on:
      <<: *redis-sentinel-depends
    environment:
      <<: *executor-redis-client-env

  executor-openshell:
    depends_on:
      <<: *redis-sentinel-depends
      openshell:
        condition: service_healthy
    environment:
      <<: *executor-redis-client-env

volumes:
  redis-data-1:
    driver: local
  redis-data-2:
    driver: local
  redis-sentinel-1-data:
    driver: local
  redis-sentinel-2-data:
    driver: local
  redis-sentinel-3-data:
    driver: local
