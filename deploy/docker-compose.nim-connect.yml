# Layer after the regular Compose files to let the council reach the NIM on its
# private Docker network. The NIM is started by docker-compose.nim.yml.
services:
  council:
    networks:
      - nomos-net
      - opa-net
      - nim-net

networks:
  nim-net:
    external: true
    name: ${NOMOS_NIM_NETWORK:-nomos-nim}
