# ─────────────────────────────────────────────────────────────
# Nomos Council — Legacy Docker Compose
#
# Legacy council-only stack kept for reference. For the beta-ready
# full stack (Redis + council + writ executor profiles), use
# deploy/docker-compose.yml instead.
#
# Usage:
#   cp deploy/.env.example deploy/.env
#   # Edit deploy/.env with your API key
#   docker compose -f deploy/docker-compose.yaml up --build
#
# The MCP endpoint will be available at:
#   http://localhost:9901/mcp
# ─────────────────────────────────────────────────────────────

services:
  redis-gears:
    image: redislabs/redisgears:latest
    container_name: nomos-redis-gears
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  council:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nomos-council
    ports:
      - "${COUNCIL_PORT:-9901}:9901"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COUNCIL_REDIS_HOST=redis-gears
      # Uncomment to use additional backends:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      # Persist workspace across restarts (optional)
      - council-workspace:/app/workspace
      - council-keys:/app/keys
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      redis-gears:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9901/debug/tools/list"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"

volumes:
  council-workspace:
  council-keys:
  redis-data:
