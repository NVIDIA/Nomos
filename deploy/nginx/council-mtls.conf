pid /tmp/nginx.pid;
events {}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 0;

    server {
        listen 9443 ssl;
        server_name council-proxy;

        ssl_certificate /run/nomos/tls/tls.crt;
        ssl_certificate_key /run/nomos/tls/tls.key;
        ssl_client_certificate /run/nomos/tls/ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        location / {
            # This sidecar shares the Council's network namespace. The Council
            # intentionally binds only to loopback in mTLS mode, so its
            # plaintext listener is reachable only through 127.0.0.1 here.
            proxy_pass http://127.0.0.1:9901;
            proxy_http_version 1.1;
            # Match the loopback listener's accepted Host values. Forwarding
            # the external service name makes FastMCP's DNS-rebinding guard
            # reject an otherwise valid proxied request with HTTP 421.
            proxy_set_header Host 127.0.0.1:9901;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
