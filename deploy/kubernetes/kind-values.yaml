#
# Kind / local overlay — full service-mode deployment (functional equivalent of
# the production stack): PostgreSQL durable store + Vault transit signing + redis
# sentinel + nginx gateway in front of a stateless council + monitor (ledger via
# council API) + executor/openshell + agent-signup console + OPA, behind
# nginx-ingress. All backends run in-cluster (dev Vault + dev Postgres).
#
# Build/load local images with deploy/kubernetes/scripts/build-kind-images.sh,
# then (scripts/deploy_stack.sh does this for you):
#   helm upgrade --install nomos deploy/kubernetes/nomos \
#     -n nomos --create-namespace -f deploy/kubernetes/kind-values.yaml
#
# Pin all object names to `nomos-*` so the in-cluster service addresses below are
# stable regardless of the Helm release name.
fullnameOverride: nomos
deploymentProfile: dev

global:
  imagePullPolicy: IfNotPresent

# Service mode: durable state in PostgreSQL, signing via Vault transit.
storage:
  mode: service

signing:
  provider: vault
  councilKeyId: nomos-council
  executorKeyId: nomos-executor
  vault:
    addr: http://nomos-vault:8200
    transitMount: transit
    auth:
      method: kubernetes
      role: nomos-signer
      audience: vault
      expirationSeconds: 600

# In-cluster dev Vault (transit) — bootstrapped by the vault-bootstrap Job.
vault:
  dev:
    enabled: true

# In-cluster dev PostgreSQL (ephemeral; the council self-migrates the schema on
# startup). uid 70 = the alpine-postgres user (Kind has no SCC to assign one).
postgres:
  dev:
    enabled: true
    persistence:
      enabled: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      fsGroupChangePolicy: OnRootMismatch

# nginx gateway is the public /mcp entrypoint (token-gated, load-balances to council).
councilGateway:
  enabled: true
  replicas: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101

council:
  replicas: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

monitor:
  ledgerSource: api
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

councilGrpc:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

agentSignup:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

# Turn on the executor's Vault signer env (evidence signed via transit).
executorOpenshell:
  signer:
    renderEnv: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

openshell:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10002
    runAsGroup: 10002
    fsGroup: 10002

opa:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

redis:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch

# Reachable by hostname via nginx-ingress (see deploy/kubernetes/kind-cluster.yaml).
ingress:
  enabled: true

networkPolicy:
  enabled: false
