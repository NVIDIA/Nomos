    tag: RELEASE.2025-04-22T22-12-26Z
    digest: ""
    pullPolicy: IfNotPresent
  minioClient:
    repository: quay.io/minio/mc
    tag: RELEASE.2025-04-16T18-13-26Z
    digest: ""
    pullPolicy: IfNotPresent

