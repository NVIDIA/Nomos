global:
  imagePullPolicy: IfNotPresent
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

deploymentProfile: dev

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  # Pull secret(s) for private registries (e.g. my-registry-pullsecret).
  # Attached to the SA so every pod using it inherits the credential.
  imagePullSecrets: []

images:
  council:
    repository: nomos/council
    tag: kind
    digest: ""
    pullPolicy: ""
  monitor:
    repository: nomos/monitor
    tag: kind
    digest: ""
    pullPolicy: ""
  executor:
    repository: nomos/executor
    tag: kind
    digest: ""
    pullPolicy: ""
  openshell:
    repository: nomos/openshell
    tag: kind
    digest: ""
    pullPolicy: ""
  agentSignup:
    repository: nomos/agent-signup
    tag: kind
    digest: ""
    pullPolicy: ""
  demo:
    repository: nomos/demo
    tag: kind
    digest: ""
    pullPolicy: ""
  redis:
    repository: redis
    tag: 7-alpine
    digest: ""
    pullPolicy: IfNotPresent
  opa:
    repository: openpolicyagent/opa
    tag: 1.17.0
    digest: ""
    pullPolicy: IfNotPresent
  gateway:
    repository: nginxinc/nginx-unprivileged
    tag: 1.27-alpine
    digest: ""
    pullPolicy: IfNotPresent
  # Dev-only backends (rendered only when postgres.dev.enabled /
