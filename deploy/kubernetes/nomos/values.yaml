    anthropicApiKey: ""
    openaiApiKey: ""
    councilRedisAccountIntegrityKey: kind-account-integrity-change-me  # pragma: allowlist secret
    councilManagementToken: kind-council-management-change-me  # pragma: allowlist secret
    monitorInternalToken: kind-monitor-internal-change-me  # pragma: allowlist secret
    monitorMcpProxyToken: kind-monitor-mcp-proxy-change-me  # pragma: allowlist secret
    monitorDashboardUser: admin
    monitorDashboardPassword: admin  # pragma: allowlist secret
    signupAdminUser: admin
    signupAdminPassword: admin  # pragma: allowlist secret
    signupCouncilAdminUser: council-admin
    signupCouncilAdminPassword: kind-council-admin-change-me  # pragma: allowlist secret
    demoAuthToken: ""  # pragma: allowlist secret
    demoAgentId: ""
    demoAuthPassword: ""  # pragma: allowlist secret
    demoK8sAdminToken: ""  # pragma: allowlist secret
    demoK8sDevToken: ""  # pragma: allowlist secret
    demoK8sReadonlyToken: ""  # pragma: allowlist secret
    # Dev-only backend credentials (postgres.dev / vault.dev / objectStorage.dev).
    postgresPassword: nomos-dev  # pragma: allowlist secret
    vaultDevRootToken: kind-vault-dev-root  # pragma: allowlist secret
    minioRootUser: nomos-dev
    minioRootPassword: nomos-dev-minio  # pragma: allowlist secret
  keys:
    redisPassword: REDIS_PASSWORD  # pragma: allowlist secret
    nvidiaApiKey: NVIDIA_API_KEY  # pragma: allowlist secret
    anthropicApiKey: ANTHROPIC_API_KEY  # pragma: allowlist secret
    openaiApiKey: OPENAI_API_KEY  # pragma: allowlist secret
    councilRedisAccountIntegrityKey: COUNCIL_REDIS_ACCOUNT_INTEGRITY_KEY  # pragma: allowlist secret
    councilManagementToken: COUNCIL_MANAGEMENT_TOKEN  # pragma: allowlist secret
    monitorInternalToken: MONITOR_INTERNAL_TOKEN  # pragma: allowlist secret
    monitorMcpProxyToken: MONITOR_MCP_PROXY_TOKEN  # pragma: allowlist secret
    monitorDashboardUser: MONITOR_DASHBOARD_USER
    monitorDashboardPassword: MONITOR_DASHBOARD_PASSWORD  # pragma: allowlist secret
    signupAdminUser: NOMOS_SIGNUP_ADMIN_USER
    signupAdminPassword: NOMOS_SIGNUP_ADMIN_PASSWORD  # pragma: allowlist secret
    signupCouncilAdminUser: NOMOS_SIGNUP_COUNCIL_ADMIN_USER
    signupCouncilAdminPassword: NOMOS_SIGNUP_COUNCIL_ADMIN_PASSWORD  # pragma: allowlist secret
    demoAuthToken: NOMOS_AUTH_TOKEN  # pragma: allowlist secret
    demoAgentId: NOMOS_AGENT_ID
    demoAuthPassword: DEMO_AUTH_PASSWORD  # pragma: allowlist secret
    demoK8sAdminToken: NOMOS_AUTH_TOKEN_K8S_ADMIN  # pragma: allowlist secret
    demoK8sDevToken: NOMOS_AUTH_TOKEN_K8S_DEV  # pragma: allowlist secret
    demoK8sReadonlyToken: NOMOS_AUTH_TOKEN_K8S_READONLY  # pragma: allowlist secret
    # Service-mode backends.
    databaseUrl: DATABASE_URL
    awsAccessKeyId: AWS_ACCESS_KEY_ID  # pragma: allowlist secret
    awsSecretAccessKey: AWS_SECRET_ACCESS_KEY  # pragma: allowlist secret
    vaultRoleId: VAULT_ROLE_ID  # pragma: allowlist secret
    vaultSecretId: VAULT_SECRET_ID  # pragma: allowlist secret
    postgresPassword: POSTGRES_PASSWORD  # pragma: allowlist secret
    vaultDevRootToken: VAULT_DEV_ROOT_TOKEN  # pragma: allowlist secret
    minioRootUser: MINIO_ROOT_USER
    minioRootPassword: MINIO_ROOT_PASSWORD  # pragma: allowlist secret

externalSecrets:
  enabled: false
  createSecretStore: false
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  remoteKey: nomos/kind
  vault:
    server: ""
    namespace: ""
    path: ""
    version: v2
    auth:
      jwt:
        path: ""
        role: ""
        serviceAccountName: vault-service-account
        audiences:
          - https://kubernetes.default.svc
        expirationSeconds: 600
  # Property names under remoteKey. The generated Kubernetes Secret uses the
  # key names under secrets.keys above, so pods do not care whether the source
  # is native Kubernetes Secret data or Vault via External Secrets Operator.
  properties:
    redisPassword: REDIS_PASSWORD  # pragma: allowlist secret
    nvidiaApiKey: NVIDIA_API_KEY  # pragma: allowlist secret
    anthropicApiKey: ANTHROPIC_API_KEY  # pragma: allowlist secret
    openaiApiKey: OPENAI_API_KEY  # pragma: allowlist secret
    councilRedisAccountIntegrityKey: COUNCIL_REDIS_ACCOUNT_INTEGRITY_KEY  # pragma: allowlist secret
    councilManagementToken: COUNCIL_MANAGEMENT_TOKEN  # pragma: allowlist secret
    monitorInternalToken: MONITOR_INTERNAL_TOKEN  # pragma: allowlist secret
    monitorMcpProxyToken: MONITOR_MCP_PROXY_TOKEN  # pragma: allowlist secret
    monitorDashboardUser: MONITOR_DASHBOARD_USER
    monitorDashboardPassword: MONITOR_DASHBOARD_PASSWORD  # pragma: allowlist secret
    signupAdminUser: NOMOS_SIGNUP_ADMIN_USER
    signupAdminPassword: NOMOS_SIGNUP_ADMIN_PASSWORD  # pragma: allowlist secret
    signupCouncilAdminUser: NOMOS_SIGNUP_COUNCIL_ADMIN_USER
    signupCouncilAdminPassword: NOMOS_SIGNUP_COUNCIL_ADMIN_PASSWORD  # pragma: allowlist secret
    demoAuthToken: NOMOS_AUTH_TOKEN  # pragma: allowlist secret
    demoAgentId: NOMOS_AGENT_ID
    demoAuthPassword: DEMO_AUTH_PASSWORD  # pragma: allowlist secret
    demoK8sAdminToken: NOMOS_AUTH_TOKEN_K8S_ADMIN  # pragma: allowlist secret
    demoK8sDevToken: NOMOS_AUTH_TOKEN_K8S_DEV  # pragma: allowlist secret
    demoK8sReadonlyToken: NOMOS_AUTH_TOKEN_K8S_READONLY  # pragma: allowlist secret

# --- Service-backed storage (PVC-free HA) ------------------------------------
# storage.mode selects the durable-state architecture:
#   pvc     (default) — current behavior: file paths on PVCs, single-replica.
#   service           — PVC-free: PostgreSQL + object storage + external signer.
#                       No application PVCs render; /app/keys, /app/public-keys,
#                       /app/dynamic-config, /app/ledger and /app/executor-keys
#                       are not mounted; /workspace becomes per-pod emptyDir.
#                       persistence.* blocks are IGNORED in service mode.
# The Kind bring-up (deploy/kubernetes/kind-values.yaml, used by
# scripts/deploy_stack.sh) selects service mode; the chart default stays pvc.
storage:
  mode: pvc

postgres:
  # External managed PostgreSQL (stg/prod). Consumed only in service mode.
  # The DSN comes from secrets.componentSecrets.postgres when component secrets
  # are enabled, else from external.secretName.
  external:
    secretName: ""
    urlKey: DATABASE_URL
  # Chart-managed single-node PostgreSQL for the dev profile ONLY (render-time
  # validation forbids it elsewhere).
  dev:
    enabled: false
    database: nomos
    username: nomos
    service:
      port: 5432
    # On OpenShift the SCC assigns a non-root UID. On plain Kubernetes (Kind)
    # the postgres image starts as root, so set runAsUser/runAsGroup/fsGroup
    # to 70 (the alpine postgres uid) there.
    podSecurityContext:
      runAsNonRoot: true
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      enabled: false
      storageClassName: ""
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

objectStorage:
  # S3-compatible artifact storage. Consumed only in service mode.
  enabled: false
  provider: s3
  bucket: ""
  region: ""
  endpoint: ""
  forcePathStyle: true
  # Credentials secret; falls back to secrets.componentSecrets.objectStorage.
  secretName: ""
  accessKeyIdKey: AWS_ACCESS_KEY_ID
  secretAccessKeyKey: AWS_SECRET_ACCESS_KEY  # pragma: allowlist secret
  # Chart-managed MinIO for the dev profile ONLY. When enabled, endpoint and
  # credentials are auto-wired to the in-cluster MinIO.
  dev:
    enabled: false
    service:
      port: 9000
      consolePort: 9001
    # See postgres.dev.podSecurityContext — same OpenShift/Kind split.
    podSecurityContext:
      runAsNonRoot: true
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      enabled: false
      storageClassName: ""
      size: 4Gi
    createBucket: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

signing:
  # file  (default) — on-disk keys under /app/keys + /app/executor-keys (pvc mode).
  # vault           — Vault transit signing; REQUIRED for service mode. Pods never
  #                   receive private key bytes.
  # memory          — tests only.
  provider: file
  councilKeyId: ""
  executorKeyId: ""
  # Approle fallback only; unused with kubernetes auth.
  secretName: ""
  vault:
    addr: ""
    namespace: ""
    transitMount: transit
    auth:
      # kubernetes — projected, audience-scoped SA token; the token FILE is
      #   /var/run/secrets/nomos/vault-token (= the app's built-in default for
      #   NOMOS_VAULT_K8S_TOKEN_PATH). No automountServiceAccountToken.
      #   Role -> NOMOS_VAULT_K8S_ROLE.
      # approle    — VAULT_ROLE_ID / VAULT_SECRET_ID from the signer secret.
      method: kubernetes
      role: ""
      audience: vault
      expirationSeconds: 600

vault:
  # In-cluster dev Vault (transit signing) for local/Kind ONLY. When enabled it
  # renders the vault-dev Deployment + the vault-bootstrap Job (transit engine,
  # ed25519 signing keys, kubernetes auth + signer role). Keys are ephemeral
  # (in-memory dev server); pair with an ephemeral Postgres so a persisted
  # ledger is never signed by keys that no longer exist.
  dev:
    enabled: false
    service:
      port: 8200
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

# Migration/verification Jobs for the service-mode cutover.
# Nothing renders while enabled=false. Jobs are immutable: every run needs a
# fresh runId. Cleanup after cutover = set enabled back to false in Git.
migration:
  enabled: false
  runId: ""
  # Key into .Values.images — reuses the digest-pinned council image.
  image: council
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  readinessVerification:
    enabled: false
    # Placeholder until the Nomos app ships migration entrypoints.
    command: ["python", "-m", "nomos.migration.verify_readiness"]
  ledgerImport:
    enabled: false
    command: ["python", "-m", "nomos.migration.import_ledger"]
    # Defaults to the chart's council ledger claim; mounted read-only.
    sourcePvc: ""

redis:
  enabled: true
  topology:
    mode: sentinel
  replicas: 3
  service:
    port: 6379
  sentinel:
    masterName: nomos-master
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeoutMilliseconds: 30000
    parallelSyncs: 1
    replicas: 3
    service:
      port: 26379
  config:
    maxmemory: 192mb
    maxmemoryPolicy: noeviction
  persistence:
    enabled: true
    storageClassName: ""
    size: 1Gi
    appendfsync: everysec
    save:
      - seconds: 900
        changes: 1
      - seconds: 300
        changes: 10
      - seconds: 60
        changes: 10000
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podSecurityContext:
    runAsNonRoot: true
    # UID/GID/fsGroup intentionally unset — OpenShift's restricted-v2 SCC
    # assigns them from the namespace's allowed range. Hardcoding fixed UIDs
    # makes pods fail SCC validation on OpenShift.
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

opa:
  enabled: true
  # HA target in service mode: 2+ (council fails closed on OPA).
  replicas: 1
  logLevel: info
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 8181
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

councilGateway:
  # Stateless nginx reverse proxy: token-gates the public /mcp endpoint and
  # load-balances per request across the council pods (council MCP is stateless,
  # so plain round-robin to the council ClusterIP needs no session affinity).
  # Reuses the monitor's MCP proxy token (secrets.keys.monitorMcpProxyToken).
  # Disabled by default; the route -> gateway cutover is a separate step.
  enabled: false
  replicas: 2
  upstreamTimeoutSeconds: 3600
  service:
    port: 8080
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  podSecurityContext:
    runAsNonRoot: true
    # UID/GID/fsGroup unset — OpenShift assigns from the namespace range.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

council:
  replicas: 1
  strategy:
    type: Recreate
  # When autoscaling.enabled, an HPA owns the replica count and the Deployment
  # omits `replicas` (so ArgoCD and the HPA don't fight). Requires CPU requests.
  # HA target in service mode: min 2, max 3+ (storage.mode=service
  # required first; render-time validation blocks scale-out on RWO PVCs).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  # Rendered only when effective replicas > 1, so a no-op today.
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 9901
  opa:
    enabled: true
    decisionPath: /v1/data/nomos/intent/decision
    policyId: strict-shell
    gitWorkflowPolicyId: git-workflow-local
    timeoutMs: "500"
    failClosed: "true"
  telemetry:
    enabled: true
    timeoutMs: "250"
  allowUncertifiedEvidence: "true"
  allowPublicBind: "false"
  persistence:
    keys:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 256Mi
    publicKeys:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 64Mi
    ledger:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 1Gi
    dynamicConfig:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    # UID/GID/fsGroup unset — OpenShift assigns from the namespace range.
  initSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

monitor:
  enabled: true
  # HA target in service mode: 2+.
  replicas: 1
  # Stats source: "" / "inline" = legacy in-memory registry (proxy-inline; not
  # populated once the gateway owns /mcp); "redis" = read the council telemetry
  # stream (post-gateway path; multi-replica-consistent). Opt-in.
  statsSource: ""
  statsStream: council:telemetry
  # file (default) — read /app/ledger/*.jsonl from the ledger PVC (pvc mode).
  # api            — read via the council ledger API (REQUIRED in service mode;
  #                  monitor never receives database credentials).
  ledgerSource: file
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 9901
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

councilGrpc:
  enabled: true
  tls:
    # Existing kubernetes.io/tls Secret. Configure for direct PA2 gRPC traffic;
    # an authenticated service mesh may provide transport encryption instead.
    secretName: ""
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 9904
  networkPolicy:
    # Empty by default: the gRPC Service remains cluster-internal and denied by
    # NetworkPolicy. Deployments enabling PA2 authorization must add only the
    # PA2 namespace/pod selectors here; transport bearer auth remains required.
    ingressFrom: []
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

agentSignup:
  enabled: true
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 9905
    annotations: {}
    # When set on OpenShift, the Service is annotated for a generated serving
    # cert and the pod mounts that secret as /app/certs/server.{crt,key}.
    servingCertSecretName: ""
  councilEndpoint: ""
  allowedCouncils: council-prod
  defaultRole: developer
  allowedRoles: readonly,developer
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

demo:
  enabled: false
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 8000
    annotations: {}
    # When set on OpenShift, the Service is annotated for a generated serving
    # cert and the pod mounts that secret as /app/certs/server.{crt,key}.
    servingCertSecretName: ""
  councilUrl: ""
  auth:
    user: demo
    includeGenericToken: true
    includeAdminToken: false
    includeDeveloperToken: true
    includeReadonlyToken: true
  podSecurityContext:
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 384Mi

executorOpenshell:
  enabled: true
  # HA target in service mode: 2+ (requires signer identity +
  # ephemeral workspaces; render-time validation blocks scale-out on key PVCs).
  replicas: 1
  strategy:
    type: Recreate
  # Artifact retention requires objectStorage.enabled (service mode).
  artifacts:
    retain: false
  # Render the executor's signer env + projected vault token in service mode.
  # Gated off until the executor main consumes vault config (app P1 note:
  # ProviderExecutorIdentity is ready, env wiring pending).
  signer:
    renderEnv: false
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    # Cluster service port mirrors the Docker host default. The container
    # still listens on 9906.
    port: 9907
    targetPort: 9906
  redisKeyPrefix: nomos
  requestTimeout: "30"
  persistence:
    keys:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 256Mi
    workspace:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: ""
      size: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    # UID/GID/fsGroup unset — OpenShift assigns from the namespace range.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

openshell:
  enabled: true
  replicas: 1
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  service:
    port: 8080
  allowedWorkdirs: /workspace
  podSecurityContext:
    runAsNonRoot: true
    # UID/GID/fsGroup unset — OpenShift assigns from the namespace range.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: false
  # External backend egress for service mode. The hardening check forbids
  # 0.0.0.0/0, so explicit CIDRs are required when the dev backends are off.
  egress:
    postgres:
      cidrs: []
      port: 5432
    objectStorage:
      cidrs: []
      port: 443
    vault:
      cidrs: []
      port: 443

ingress:
  # Kind-native ingress (replaces OpenShift Routes). Requires an ingress-nginx
  # controller on the cluster. One Ingress is rendered per host entry below;
  # `service` is the component Service suffix (Service = <release>-<service>).
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: mcp.nomos.local
      service: council-gateway
      port: 8080
      path: /
    - host: monitor.nomos.local
      service: monitor
      port: 9901
      path: /
    - host: signup.nomos.local
      service: agent-signup
      port: 9905
      backendProtocol: HTTPS
      path: /
