{{- if .Values.opa.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nomos.fullname" . }}-opa
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.opa.service.port }}
      targetPort: http
  selector:
    {{- include "nomos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomos.fullname" . }}-opa
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opa
  template:
    metadata:
      labels:
        {{- include "nomos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opa
    spec:
      {{- include "nomos.commonPodFields" (dict "root" . "component" "opa") | nindent 6 }}
      {{- with include "nomos.topologySpread" (dict "root" . "component" "opa" "config" .Values.opa.topologySpreadConstraints "replicas" .Values.opa.replicas) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.opa.podSecurityContext | nindent 8 }}
      containers:
        - name: opa
          image: {{ include "nomos.image" (dict "root" . "name" "opa") | quote }}
          imagePullPolicy: {{ include "nomos.pullPolicy" (dict "root" . "name" "opa") }}
          securityContext:
            {{- toYaml .Values.opa.securityContext | nindent 12 }}
          args:
            - run
            - --server
            - --addr={{ ternary "https://0.0.0.0:8181" "0.0.0.0:8181" .Values.mtls.enabled }}
            {{- if .Values.mtls.enabled }}
            - --authentication=tls
            - --tls-cert-file=/run/nomos/tls/tls.crt
            - --tls-private-key-file=/run/nomos/tls/tls.key
            - --tls-ca-cert-file=/run/nomos/tls/ca.crt
            - --tls-cert-refresh-period=30s
            {{- end }}
            - --log-level={{ .Values.opa.logLevel }}
            - /policies/intent_filter.rego
          ports:
            - name: http
              containerPort: 8181
          livenessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: /health
              port: http
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: /health
              port: http
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- include "nomos.mtlsVolumeMount" . | nindent 12 }}
          {{- with .Values.opa.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: policies
          configMap:
            name: {{ include "nomos.fullname" . }}-opa-policies
        - name: tmp
          emptyDir: {}
        {{- include "nomos.mtlsVolume" (dict "root" . "component" "opa") | nindent 8 }}
{{- end }}
