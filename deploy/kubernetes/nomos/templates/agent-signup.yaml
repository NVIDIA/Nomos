{{- if .Values.agentSignup.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nomos.fullname" . }}-agent-signup
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-signup
spec:
  type: ClusterIP
  ports:
    - name: https
      port: {{ .Values.agentSignup.service.port }}
      targetPort: https
  selector:
    {{- include "nomos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-signup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomos.fullname" . }}-agent-signup
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-signup
spec:
  replicas: {{ .Values.agentSignup.replicas }}
  selector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-signup
  template:
    metadata:
      labels:
        {{- include "nomos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-signup
    spec:
      {{- include "nomos.commonPodFields" (dict "root" . "component" "agent-signup") | nindent 6 }}
      {{- with include "nomos.topologySpread" (dict "root" . "component" "agent-signup" "config" .Values.agentSignup.topologySpreadConstraints "replicas" .Values.agentSignup.replicas) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agentSignup.podSecurityContext | nindent 8 }}
      {{- if and (eq (include "nomos.storageMode" .) "service") .Values.postgres.dev.enabled }}
      initContainers:
        {{- include "nomos.postgresWaitInitContainer" (dict "root" . "image" "agentSignup") | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-signup
          image: {{ include "nomos.image" (dict "root" . "name" "agentSignup") | quote }}
          imagePullPolicy: {{ include "nomos.pullPolicy" (dict "root" . "name" "agentSignup") }}
          securityContext:
            {{- toYaml .Values.agentSignup.securityContext | nindent 12 }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NOMOS_DEPLOY_PROFILE
              value: {{ .Values.deploymentProfile | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "signup" "key" .Values.secrets.keys.redisPassword) | nindent 16 }}
            - name: NOMOS_SIGNUP_REDIS_URL
              value: {{ printf "redis://:$(REDIS_PASSWORD)@%s-redis:%v/0" (include "nomos.fullname" .) .Values.redis.service.port | quote }}
            - name: NOMOS_SIGNUP_REDIS_PREFIX
              value: "nomos:"
            - name: NOMOS_SIGNUP_REDIS_MODE
              value: {{ include "nomos.redisMode" . | quote }}
            - name: NOMOS_SIGNUP_REDIS_SENTINEL_SERVICE_NAME
              value: {{ .Values.redis.sentinel.masterName | quote }}
            - name: NOMOS_SIGNUP_REDIS_SENTINEL_NODES
              value: {{ include "nomos.redisSentinelNodes" . | quote }}
            - name: NOMOS_SIGNUP_REDIS_CONNECT_TIMEOUT_MS
              value: "1000"
            - name: NOMOS_SIGNUP_REDIS_COMMAND_TIMEOUT_MS
              value: "1000"
            {{- include "nomos.mtlsClientEnv" (dict "root" . "prefix" "NOMOS_SIGNUP_REDIS") | nindent 12 }}
            {{- if .Values.mtls.enabled }}
            - name: TLS_CERT_FILE
              value: /run/nomos/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /run/nomos/tls/tls.key
            {{- end }}
            - name: NOMOS_ACCOUNT_INTEGRITY_KEY
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "signup" "key" .Values.secrets.keys.councilRedisAccountIntegrityKey) | nindent 16 }}
            - name: NOMOS_SIGNUP_COUNCIL_ID
              value: council-prod
            - name: NOMOS_SIGNUP_ALLOWED_COUNCILS
              value: {{ .Values.agentSignup.allowedCouncils | quote }}
            - name: NOMOS_SIGNUP_DEFAULT_ROLE
              value: {{ .Values.agentSignup.defaultRole | quote }}
            - name: NOMOS_SIGNUP_ALLOWED_ROLES
              value: {{ .Values.agentSignup.allowedRoles | quote }}
            - name: NOMOS_SIGNUP_COUNCIL_ENDPOINT
              value: {{ default (printf "%s://%s-monitor:%v/mcp" (ternary "https" "http" .Values.mtls.enabled) (include "nomos.fullname" .) .Values.monitor.service.port) .Values.agentSignup.councilEndpoint | quote }}
            - name: NOMOS_SIGNUP_ADMIN_USER
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "signup" "key" .Values.secrets.keys.signupAdminUser) | nindent 16 }}
            - name: NOMOS_SIGNUP_ADMIN_PASSWORD
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "signup" "key" .Values.secrets.keys.signupAdminPassword) | nindent 16 }}
            - name: NOMOS_SIGNUP_COUNCIL_ADMIN_USER
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "signup" "key" .Values.secrets.keys.signupCouncilAdminUser) | nindent 16 }}
            - name: NOMOS_SIGNUP_COUNCIL_ADMIN_PASSWORD
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "signup" "key" .Values.secrets.keys.signupCouncilAdminPassword) | nindent 16 }}
            {{- if eq (include "nomos.storageMode" .) "service" }}
            {{- /* Service mode: write accounts + trusted executors to the durable
            store the council reads (PostgreSQL). The app fails over to redis only
            when COUNCIL_STORAGE_MODE != postgres. */}}
            - name: COUNCIL_STORAGE_MODE
              value: postgres
            {{- include "nomos.databaseUrlEnv" (dict "root" . "urlEnv" "COUNCIL_DATABASE_URL") | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: 9905
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: certs
              mountPath: /app/certs
            - name: tmp
              mountPath: /tmp
            {{- include "nomos.mtlsVolumeMount" . | nindent 12 }}
          {{- with .Values.agentSignup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: certs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "nomos.mtlsVolume" (dict "root" . "component" "agentSignup") | nindent 8 }}
{{- end }}
