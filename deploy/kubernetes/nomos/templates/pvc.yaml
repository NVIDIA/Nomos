{{- if .Values.council.persistence.keys.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nomos.fullname" . }}-council-keys
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.council.persistence.keys.storageClassName }}
  storageClassName: {{ .Values.council.persistence.keys.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.council.persistence.keys.size | quote }}
{{- end }}
