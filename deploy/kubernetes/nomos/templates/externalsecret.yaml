{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "nomos.fullname" . }}-secrets
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | quote }}
  target:
    name: {{ include "nomos.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keys.redisPassword }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.redisPassword | quote }}
    - secretKey: {{ .Values.secrets.keys.nvidiaApiKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.nvidiaApiKey | quote }}
    - secretKey: {{ .Values.secrets.keys.anthropicApiKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.anthropicApiKey | quote }}
    - secretKey: {{ .Values.secrets.keys.openaiApiKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.openaiApiKey | quote }}
    - secretKey: {{ .Values.secrets.keys.councilRedisAccountIntegrityKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.councilRedisAccountIntegrityKey | quote }}
    - secretKey: {{ .Values.secrets.keys.councilManagementToken }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.councilManagementToken | quote }}
    - secretKey: {{ .Values.secrets.keys.monitorInternalToken }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.monitorInternalToken | quote }}
    - secretKey: {{ .Values.secrets.keys.monitorDashboardUser }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.monitorDashboardUser | quote }}
    - secretKey: {{ .Values.secrets.keys.monitorDashboardPassword }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.monitorDashboardPassword | quote }}
    - secretKey: {{ .Values.secrets.keys.signupAdminUser }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.signupAdminUser | quote }}
    - secretKey: {{ .Values.secrets.keys.signupAdminPassword }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.signupAdminPassword | quote }}
    - secretKey: {{ .Values.secrets.keys.demoAuthToken }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.demoAuthToken | quote }}
    - secretKey: {{ .Values.secrets.keys.demoAgentId }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.demoAgentId | quote }}
    - secretKey: {{ .Values.secrets.keys.demoK8sAdminToken }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.demoK8sAdminToken | quote }}
    - secretKey: {{ .Values.secrets.keys.demoK8sDevToken }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.demoK8sDevToken | quote }}
    - secretKey: {{ .Values.secrets.keys.demoK8sReadonlyToken }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
        property: {{ .Values.externalSecrets.properties.demoK8sReadonlyToken | quote }}
{{- end }}
