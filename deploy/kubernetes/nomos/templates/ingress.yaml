{{- if .Values.ingress.enabled }}
{{- /*
Kind-native ingress (replaces OpenShift Routes). One Ingress per host so that
the agent-signup host can carry the HTTPS backend-protocol annotation (it serves
self-signed TLS) while the gateway/monitor hosts stay plain HTTP.
*/}}
{{- $fullName := include "nomos.fullname" . -}}
{{- range $h := .Values.ingress.hosts }}
{{- if $h.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s" $fullName $h.service }}
  labels:
    {{- include "nomos.labels" $ | nindent 4 }}
  {{- if or $.Values.ingress.annotations (eq ($h.backendProtocol | default "HTTP") "HTTPS") }}
  annotations:
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if eq ($h.backendProtocol | default "HTTP") "HTTPS" }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  rules:
    - host: {{ $h.host | quote }}
      http:
        paths:
          - path: {{ $h.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-%s" $fullName $h.service }}
                port:
                  number: {{ $h.port }}
{{- end }}
{{- end }}
{{- end }}
