{{- if .Values.council.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nomos.fullname" . }}-council
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: council
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nomos.fullname" . }}-council
  minReplicas: {{ .Values.council.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.council.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.council.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
