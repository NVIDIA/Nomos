apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nomos.fullname" . }}-council-config
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
data:
  council.yaml: |-
{{ default (.Files.Get "files/council/council.yaml") .Values.council.configOverride | indent 4 }}
  local_council_catalog.yaml: |-
{{ .Files.Get "files/council/local_council_catalog.yaml" | indent 4 }}
  attestation_questions.yaml: |-
{{ .Files.Get "files/council/attestation_questions.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nomos.fullname" . }}-executor-openshell-config
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
data:
  executor-openshell.yaml: |-
{{ tpl (.Files.Get "files/executor/executor-openshell.yaml") . | indent 4 }}
{{- if .Values.opa.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nomos.fullname" . }}-opa-policies
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/policies/*").AsConfig | indent 2 }}
{{- end }}
