{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomos.fullname" . }}-openshell-runtime
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: openshell
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: executor-openshell
      ports:
        - protocol: TCP
          port: 8080
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomos.fullname" . }}-opa
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opa
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: council
      ports:
        - protocol: TCP
          port: 8181
{{- if .Values.redis.enabled }}
{{- $redisMode := include "nomos.redisMode" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomos.fullname" . }}-redis
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: council
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: executor-openshell
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-signup
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
        {{- if eq $redisMode "sentinel" }}
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis-sentinel
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- if eq $redisMode "sentinel" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nomos.fullname" . }}-redis-sentinel
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-sentinel
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: council
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: executor-openshell
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-signup
        - podSelector:
            matchLabels:
              {{- include "nomos.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis-sentinel
      ports:
        - protocol: TCP
          port: {{ .Values.redis.sentinel.service.port }}
{{- end }}
{{- end }}
{{- end }}
