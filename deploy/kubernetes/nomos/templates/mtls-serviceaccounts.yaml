{{- if .Values.mtls.enabled }}
{{- $root := . }}
{{- range $component := list "council" "monitor" "council-grpc" "council-gateway" "executor" "openshell" "agent-signup" "redis" "opa" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" (include "nomos.fullname" $root) $component | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "nomos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- with $root.Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
