{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nomos.secretName" . }}
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.redisPassword }}: {{ .Values.secrets.stringData.redisPassword | quote }}
  {{ .Values.secrets.keys.nvidiaApiKey }}: {{ .Values.secrets.stringData.nvidiaApiKey | default "" | quote }}
  {{ .Values.secrets.keys.anthropicApiKey }}: {{ .Values.secrets.stringData.anthropicApiKey | default "" | quote }}
  {{ .Values.secrets.keys.openaiApiKey }}: {{ .Values.secrets.stringData.openaiApiKey | default "" | quote }}
  {{ .Values.secrets.keys.councilRedisAccountIntegrityKey }}: {{ .Values.secrets.stringData.councilRedisAccountIntegrityKey | quote }}
  {{ .Values.secrets.keys.councilManagementToken }}: {{ .Values.secrets.stringData.councilManagementToken | quote }}
  {{ .Values.secrets.keys.monitorInternalToken }}: {{ .Values.secrets.stringData.monitorInternalToken | quote }}
  {{ .Values.secrets.keys.monitorMcpProxyToken }}: {{ .Values.secrets.stringData.monitorMcpProxyToken | quote }}
  {{ .Values.secrets.keys.monitorDashboardUser }}: {{ .Values.secrets.stringData.monitorDashboardUser | quote }}
  {{ .Values.secrets.keys.monitorDashboardPassword }}: {{ .Values.secrets.stringData.monitorDashboardPassword | quote }}
  {{ .Values.secrets.keys.signupAdminUser }}: {{ .Values.secrets.stringData.signupAdminUser | quote }}
  {{ .Values.secrets.keys.signupAdminPassword }}: {{ .Values.secrets.stringData.signupAdminPassword | quote }}
  {{ .Values.secrets.keys.signupCouncilAdminUser }}: {{ .Values.secrets.stringData.signupCouncilAdminUser | quote }}
  {{ .Values.secrets.keys.signupCouncilAdminPassword }}: {{ .Values.secrets.stringData.signupCouncilAdminPassword | quote }}
  {{ .Values.secrets.keys.demoAuthToken }}: {{ .Values.secrets.stringData.demoAuthToken | default "" | quote }}
  {{ .Values.secrets.keys.demoAgentId }}: {{ .Values.secrets.stringData.demoAgentId | default "" | quote }}
  {{ .Values.secrets.keys.demoAuthPassword }}: {{ .Values.secrets.stringData.demoAuthPassword | default "" | quote }}
  {{ .Values.secrets.keys.demoK8sAdminToken }}: {{ .Values.secrets.stringData.demoK8sAdminToken | default "" | quote }}
  {{ .Values.secrets.keys.demoK8sDevToken }}: {{ .Values.secrets.stringData.demoK8sDevToken | default "" | quote }}
  {{ .Values.secrets.keys.demoK8sReadonlyToken }}: {{ .Values.secrets.stringData.demoK8sReadonlyToken | default "" | quote }}
  {{- if .Values.postgres.dev.enabled }}
  {{ .Values.secrets.keys.postgresPassword }}: {{ .Values.secrets.stringData.postgresPassword | quote }}
  {{- end }}
  {{- if (.Values.vault).dev.enabled }}
  {{ .Values.secrets.keys.vaultDevRootToken }}: {{ .Values.secrets.stringData.vaultDevRootToken | quote }}
  {{- end }}
  {{- if and .Values.objectStorage.enabled .Values.objectStorage.dev.enabled }}
  {{ .Values.secrets.keys.minioRootUser }}: {{ .Values.secrets.stringData.minioRootUser | quote }}
  {{ .Values.secrets.keys.minioRootPassword }}: {{ .Values.secrets.stringData.minioRootPassword | quote }}
  {{- end }}
{{- end }}
