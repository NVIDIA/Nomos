{{- if .Values.monitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nomos.fullname" . }}-monitor
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.monitor.service.port }}
      targetPort: http
  selector:
    {{- include "nomos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
---
{{- $ledgerFromFile := eq (.Values.monitor.ledgerSource | default "file") "file" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomos.fullname" . }}-monitor
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitor
spec:
  replicas: {{ .Values.monitor.replicas }}
  selector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: monitor
  template:
    metadata:
      labels:
        {{- include "nomos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: monitor
    spec:
      {{- include "nomos.commonPodFields" (dict "root" . "component" "monitor") | nindent 6 }}
      {{- with include "nomos.topologySpread" (dict "root" . "component" "monitor" "config" .Values.monitor.topologySpreadConstraints "replicas" .Values.monitor.replicas) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.monitor.podSecurityContext | nindent 8 }}
      containers:
        - name: monitor
          image: {{ include "nomos.image" (dict "root" . "name" "monitor") | quote }}
          imagePullPolicy: {{ include "nomos.pullPolicy" (dict "root" . "name" "monitor") }}
          securityContext:
            {{- toYaml .Values.monitor.securityContext | nindent 12 }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NOMOS_DEPLOY_PROFILE
              value: {{ .Values.deploymentProfile | quote }}
            - name: MONITOR_UPSTREAM
              value: {{ printf "%s://%s-council:%v/mcp" (ternary "https" "http" .Values.mtls.enabled) (include "nomos.fullname" .) .Values.council.service.port | quote }}
            - name: MONITOR_UPSTREAM_HEALTH
              value: {{ printf "%s://%s-council:%v/debug/tools/list" (ternary "https" "http" .Values.mtls.enabled) (include "nomos.fullname" .) .Values.council.service.port | quote }}
            {{- include "nomos.mtlsClientEnv" (dict "root" . "prefix" "MONITOR_UPSTREAM") | nindent 12 }}
            {{- include "nomos.mtlsListenerEnv" (dict "root" . "prefix" "MONITOR_LISTENER") | nindent 12 }}
            - name: MONITOR_INTERNAL_TOKEN
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "monitor" "key" .Values.secrets.keys.monitorInternalToken) | nindent 16 }}
            - name: MONITOR_DASHBOARD_USER
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "monitor" "key" .Values.secrets.keys.monitorDashboardUser) | nindent 16 }}
            - name: MONITOR_DASHBOARD_PASSWORD
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "monitor" "key" .Values.secrets.keys.monitorDashboardPassword) | nindent 16 }}
            - name: MONITOR_MCP_PROXY_TOKEN
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "monitor" "key" .Values.secrets.keys.monitorMcpProxyToken) | nindent 16 }}
            {{- if .Values.monitor.statsSource }}
            - name: MONITOR_STATS_SOURCE
              value: {{ .Values.monitor.statsSource | quote }}
            {{- end }}
            {{- if eq (.Values.monitor.statsSource | default "") "redis" }}
            # Stats path: read the council telemetry stream from redis (same
            # topology contract as council; stream = redis key_prefix + council stream).
            - name: MONITOR_STATS_STREAM
              value: {{ printf "nomos:%s" (.Values.monitor.statsStream | default "council:telemetry") | quote }}
            - name: MONITOR_REDIS_MODE
              value: {{ include "nomos.redisMode" . | quote }}
            - name: MONITOR_REDIS_HOST
              value: {{ printf "%s-redis" (include "nomos.fullname" .) | quote }}
            - name: MONITOR_REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}
            - name: MONITOR_REDIS_SENTINEL_SERVICE_NAME
              value: {{ .Values.redis.sentinel.masterName | quote }}
            - name: MONITOR_REDIS_SENTINEL_NODES
              value: {{ include "nomos.redisSentinelNodes" . | quote }}
            - name: MONITOR_REDIS_PASSWORD
              valueFrom:
                {{- include "nomos.secretKeyRef" (dict "root" . "component" "monitor" "key" .Values.secrets.keys.redisPassword) | nindent 16 }}
            {{- include "nomos.mtlsClientEnv" (dict "root" . "prefix" "MONITOR_REDIS") | nindent 12 }}
            {{- end }}
            {{- if $ledgerFromFile }}
            - name: MONITOR_LEDGER_PATHS
              value: /app/ledger/*.jsonl
            {{- else }}
            {{- /* Service mode (Proposal 07): monitor reads ledger data via the
            council API and deliberately never receives database credentials. */}}
            - name: MONITOR_LEDGER_SOURCE
              value: api
            - name: MONITOR_LEDGER_API_URL
              value: {{ printf "http://%s-council:%v" (include "nomos.fullname" .) .Values.council.service.port | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9901
          # Probes hit /livez (process-only), NOT /healthz. /healthz round-trips to
          # the council and returns 503 while it warms up; probing it coupled the
          # proxy's readiness/liveness to the upstream, so on a slow/cold start the
          # liveness probe would KILL the monitor before the council was up and the
          # Deployment blew its progress deadline. The proxy is alive/ready as soon
          # as it is listening (it serves 502s while the council warms). Aggregate
          # upstream health is still observable at /healthz (dashboard, smoke checks).
          {{- if .Values.mtls.enabled }}
          livenessProbe:
            exec:
              command: ["curl", "-sf", "--cacert", "/run/nomos/tls/ca.crt", "--cert", "/run/nomos/tls/tls.crt", "--key", "/run/nomos/tls/tls.key", "https://localhost:9901/livez"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["curl", "-sf", "--cacert", "/run/nomos/tls/ca.crt", "--cert", "/run/nomos/tls/tls.crt", "--key", "/run/nomos/tls/tls.key", "https://localhost:9901/livez"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          {{- else }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          {{- end }}
          volumeMounts:
            {{- if $ledgerFromFile }}
            - name: council-ledger
              mountPath: /app/ledger
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- include "nomos.mtlsVolumeMount" . | nindent 12 }}
          {{- with .Values.monitor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if $ledgerFromFile }}
        - name: council-ledger
          {{- if and (eq (include "nomos.storageMode" .) "pvc") .Values.council.persistence.ledger.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nomos.fullname" . }}-council-ledger
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- include "nomos.mtlsVolume" (dict "root" . "component" "monitor") | nindent 8 }}
{{- end }}
