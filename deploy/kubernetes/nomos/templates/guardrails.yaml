{{- if .Values.guardrails.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nomos.fullname" . }}-guardrails
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.guardrails.service.port }}
      targetPort: http
  selector:
    {{- include "nomos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomos.fullname" . }}-guardrails
  labels:
    {{- include "nomos.labels" . | nindent 4 }}
    app.kubernetes.io/component: guardrails
spec:
  replicas: {{ .Values.guardrails.replicas }}
  selector:
    matchLabels:
      {{- include "nomos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: guardrails
  template:
    metadata:
      labels:
        {{- include "nomos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: guardrails
    spec:
      {{- include "nomos.commonPodFields" . | nindent 6 }}
      {{- with include "nomos.topologySpread" (dict "root" . "component" "guardrails" "config" .Values.guardrails.topologySpreadConstraints "replicas" .Values.guardrails.replicas) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.guardrails.podSecurityContext | nindent 8 }}
      containers:
        - name: guardrails
          image: {{ include "nomos.image" (dict "root" . "name" "guardrails") | quote }}
          imagePullPolicy: {{ include "nomos.pullPolicy" (dict "root" . "name" "guardrails") }}
          securityContext:
            {{- toYaml .Values.guardrails.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: configs
              mountPath: /configs/{{ .Values.guardrails.configId }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.guardrails.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: configs
          configMap:
            name: {{ include "nomos.fullname" . }}-guardrails-configs
        - name: tmp
          emptyDir: {}
{{- end }}
