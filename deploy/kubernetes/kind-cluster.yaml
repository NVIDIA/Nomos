#
# Kind cluster config for the Nomos service-mode local stack. The control-plane
# node is labelled ingress-ready and maps host ports 80/443 so the ingress-nginx
# controller is reachable from the host (http://*.nomos.local via /etc/hosts).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
