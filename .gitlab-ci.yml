workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH"

stages:
  - validate
  - test
  - security
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy

.python_job:
  image: python:3.13-slim
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
      - .venv
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install uv
    - uv sync --frozen --extra all

validate_config:
  extends: .python_job
  stage: validate
  script:
    - uv run python -m compileall -q nomos executors trusted_executor_contract monitor demo scripts
    - uv run python -c "import yaml; yaml.safe_load(open('.gitlab-ci.yml'))"
    - NVIDIA_API_KEY=dummy COUNCIL_REDIS_HOST=redis COUNCIL_REDIS_PASSWORD=dummy uv run python -c "from nomos.config.settings import load_config; load_config('configs/council.yaml')"

lint:
  extends: .python_job
  stage: validate
  script:
    - uv run ruff check .
    - uv run ruff format --check .

type_check:
  extends: .python_job
  stage: validate
  script:
    - uv run mypy nomos

unit_tests:
  extends: .python_job
  stage: test
  script:
    - mkdir -p reports
    - ./scripts/run_test_suite.py --profile unit --report reports/nomos-test-report.html --junit-dir reports/junit
  artifacts:
    when: always
    reports:
      junit: reports/junit/unit.xml
    paths:
      - reports/nomos-test-report.html
      - reports/junit/unit.xml
    expire_in: 14 days

secret_scan:
  extends: .python_job
  stage: security
  script:
    - git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline --exclude-files 'deploy/\.env\.example$'

bandit:
  extends: .python_job
  stage: security
  script:
    - uv run bandit -c pyproject.toml -r nomos executors trusted_executor_contract monitor demo

hadolint:
  stage: security
  # The default hadolint/hadolint:<version> image is distroless and has no
  # shell; GitLab Runner's job harness then fails with
  # "exec: sh: executable file not found in $PATH" even with entrypoint: "".
  # The -alpine variant ships a shell.
  image:
    name: hadolint/hadolint:v2.14.0-alpine
    entrypoint: [""]
  interruptible: true
  script:
    - hadolint --ignore DL3008 --ignore DL3013 deploy/Dockerfile deploy/Dockerfile.demo deploy/Dockerfile.executor deploy/Dockerfile.monitor deploy/Dockerfile.openshell

compose_config:
  stage: build
  image: docker:27-cli
  interruptible: true
  script:
    - docker compose -f deploy/docker-compose.yml config > compose.rendered.yml
  artifacts:
    paths:
      - compose.rendered.yml
    expire_in: 14 days

package:
  extends: .python_job
  stage: build
  # Temporarily disabled — re-enable by removing the `rules:` block.
  rules:
    - when: never
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 14 days

docker_build_images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  interruptible: true
  # Temporarily disabled — re-enable by restoring the previous rules block
  # (manual + allow_failure on MRs and branches).
  rules:
    - when: never
  script:
    - docker build -f deploy/Dockerfile -t nomos-council:ci .
    - docker build -f deploy/Dockerfile.monitor -t nomos-monitor:ci .
    - docker build -f deploy/Dockerfile.demo -t nomos-demo:ci .
    - docker build -f deploy/Dockerfile.executor -t nomos-executor:ci .
    - docker build -f deploy/Dockerfile.openshell -t nomos-openshell:ci .
